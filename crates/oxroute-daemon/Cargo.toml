[package]
name = "oxroute-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The oxroute daemon: runs the hub and serves the HTTP + SSE API."

[[bin]]
name = "oxrouted"
path = "src/main.rs"

[dependencies]
oxroute-core = { path = "../oxroute-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
oxdraw.workspace = true
# OxDraw 0.2.1 enables reqwest's native TLS defaults even when its HTTP server
# is disabled. Vendoring OpenSSL keeps daemon builds reproducible on minimal VMs.
openssl = { version = "0.10", features = ["vendored"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
async-stream = "0.3.6"
portable-pty = "0.9.0"
[dev-dependencies]
reqwest.workspace = true
async-trait = "0.1.92"
